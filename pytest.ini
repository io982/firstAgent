[pytest]
# Регистрируем кастомные метки, чтобы не было предупреждений
markers =
    integration: marks tests as integration tests (requires local Ollama running)
    slow: statistical tests, many model calls (~90 s each). Run: pytest -m slow

# По умолчанию пропускаем интеграционные тесты (запускаем только быстрые)
addopts = -m "not integration and not slow"